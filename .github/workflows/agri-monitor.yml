name: Agricultural information monitor

on:
  schedule:
    # 23:37 UTC Sun-Fri = 07:37 Asia/Taipei Mon-Sat (UTC+8, no DST).
    # Monday collects Saturday-Sunday; Tuesday-Saturday collect the previous day.
    - cron: "37 23 * * 0-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not write to Notion or send Email)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agri-monitor-daily
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A single-source failure retries once; a total network outage retries before reporting.
    timeout-minutes: 120
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      ACRI_SOURCE_URL: https://mboxap.acri.gov.tw/POP30/FAQ/FAQ/GetFaqList
      ACRI_NOTION_DATABASE_ID: e2c49f31c2424e9db4b37cb662e079ff
      ACRI_NOTION_DATA_SOURCE_ID: 2f330716-3b97-4782-99b7-c2eb898b2e36
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TIMEZONE: Asia/Taipei
      SOURCES_FILE: sources.yml
      ARTICLE_LOOKBACK_DAYS: 30
      ARTICLE_STATE_FILE: .state/sent_articles.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run monitor
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          python -m agri_monitor "${args[@]}"
      - name: Commit sent article state
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- .state/sent_articles.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/sent_articles.json
          git commit -m "chore: update sent article state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
